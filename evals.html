<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evals · WebRouter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #E9E5EB;          /* primary */
    --surface: #F5F3F6;
    --tile: #FFFFFF;
    --ink: #1F1A24;
    --muted: #5C5465;
    --line: #D2CAD6;
    --lime: #EAFFCD;        /* secondary */
    --lime-edge: #B9DC8C;
    --on-lime: #1F1A24;
    --accent-text: #3D6414;

    --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
    --body: "Instrument Sans", "Helvetica Neue", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #18151B;
      --surface: #221E26;
      --tile: #F5F3F6;
      --ink: #EEEAF0;
      --muted: #A89FAF;
      --line: #36303C;
      --lime-edge: #7FA257;
      --accent-text: #D6F5AE;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #18151B;
    --surface: #221E26;
    --tile: #F5F3F6;
    --ink: #EEEAF0;
    --muted: #A89FAF;
    --line: #36303C;
    --lime-edge: #7FA257;
    --accent-text: #D6F5AE;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 17px;
    line-height: 1.55;
    padding-inline: 20px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; }
  h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.02em; }
  p { margin: 0; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent-text); outline-offset: 3px; border-radius: 4px; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* nav */
  nav { padding-block: 22px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .nav-links { display: flex; align-items: center; gap: 28px; list-style: none; margin: 0; padding: 0; font-size: 15px; font-weight: 500; }
  .nav-links a { text-decoration: none; color: var(--muted); transition: color 150ms; }
  .nav-links a:hover, .nav-links a[aria-current="page"] { color: var(--ink); }
  .nav-links .gh {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px;
    color: var(--ink); background: var(--surface);
  }
  .nav-links .gh:hover { border-color: var(--muted); }
  .nav-links .gh svg { width: 16px; height: 16px; }
  @media (max-width: 520px) {
    nav { flex-wrap: wrap; column-gap: 10px; row-gap: 10px; }
    nav .wordmark { font-size: 14px; }
    .nav-links { gap: 9px; font-size: 13px; }
    .nav-links .gh { padding: 5px 8px; }
    .nav-links .gh span { display: none; }
  }
  .wordmark { font-family: var(--mono); font-weight: 500; font-size: 16px; text-decoration: none; }
  .wordmark span { color: var(--muted); }

  /* hero */
  .hero { padding-block: 72px 96px; display: grid; gap: 28px; text-align: center; justify-items: center; }
  .hero h1 {
    font-size: clamp(34px, 5.4vw, 64px);
    justify-items: center;
    line-height: 0.98;
    font-weight: 700;
    display: grid;
  }
  .hero h1 mark {
    background: var(--lime);
    color: var(--on-lime);
    padding: 0 0.12em;
    border-radius: 0.12em;
    justify-self: center;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .hero .sub { font-size: clamp(18px, 2.2vw, 22px); color: var(--muted); max-width: 34em; }

  section { padding-block: 88px; border-top: 1px solid var(--line); }
  .section-head { display: grid; gap: 14px; max-width: 40em; }
  h2 { font-size: clamp(32px, 4.6vw, 52px); line-height: 1.05; font-weight: 700; }
  .lede { font-size: 19px; color: var(--muted); max-width: 36em; }

  /* problem → solution */
  .easy { margin-top: 64px; }

  /* agent → provider motion */
  .router { position: relative; min-width: 0; width: 100%; margin: 20px 0 0; padding-top: 4px; }
  .agent {
    position: relative; z-index: 2;
    width: max-content; margin-inline: auto;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px 10px 10px;
    background: var(--ink); color: var(--bg);
    border-radius: 999px;
    font: 600 15px/1 var(--body);
    box-shadow: 0 12px 30px -14px rgba(31, 26, 36, 0.55);
  }
  .agent-icon {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--lime); color: var(--on-lime);
    display: grid; place-items: center;
  }
  .agent-icon svg { width: 24px; height: 24px; }
  .agent.firing .agent-icon { animation: agent-pulse 420ms ease-out; }
  @keyframes agent-pulse {
    0% { box-shadow: 0 0 0 0 var(--lime-edge); }
    100% { box-shadow: 0 0 0 12px transparent; }
  }
  .hop {
    position: relative; z-index: 2;
    width: max-content; margin: 64px auto 0;
    display: flex; align-items: center; gap: 10px;
    padding: 11px 18px;
    background: var(--lime); color: var(--on-lime);
    border: 1px solid var(--lime-edge);
    border-radius: 12px;
    font: 500 16px/1 var(--mono);
  }
  .hop span { opacity: 0.55; }
  .hop.firing { animation: hop-pulse 420ms ease-out; }
  @keyframes hop-pulse {
    0% { box-shadow: 0 0 0 0 var(--lime-edge); }
    100% { box-shadow: 0 0 0 12px transparent; }
  }
  .zaps { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: visible; }
  .zaps .glow { fill: none; stroke: var(--lime-edge); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; opacity: 0.45; }
  .zaps .bolt { fill: none; stroke: var(--accent-text); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: miter; }
  .belt {
    margin-top: 88px;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent);
  }
  .belt-track {
    display: flex; gap: 12px; width: max-content;
    list-style: none; margin: 0; padding: 10px 0;
    animation: belt 70s linear infinite;
  }
  @keyframes belt { from { transform: translateX(-50%); } to { transform: translateX(0); } }
  .belt-track li {
    flex: none;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px 10px 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    font-weight: 500; font-size: 15px; white-space: nowrap;
    transition: background 400ms, border-color 400ms, transform 400ms;
  }
  .belt-track li.hit { background: var(--lime); color: var(--on-lime); border-color: var(--lime-edge); transform: translateY(-3px); transition-duration: 120ms; }
  .belt-track .mark { flex: none; width: 32px; height: 32px; border-radius: 8px; background: var(--tile); display: grid; place-items: center; overflow: hidden; }
  .belt-track img { width: 22px; height: 22px; object-fit: contain; }
  @media (max-width: 860px) { .hop { margin-top: 52px; } .belt { margin-top: 72px; } }
  @media (prefers-reduced-motion: reduce) {
    .belt-track { animation: none; flex-wrap: wrap; justify-content: center; width: auto; }
    .belt-track li[aria-hidden="true"] { display: none; }
    .belt { -webkit-mask-image: none; mask-image: none; margin-top: 32px; }
    .hop { margin-top: 24px; }
  }

  /* benefits */
  .benefits { margin-top: 36px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
  .benefit { border-top: 2px solid var(--ink); padding-top: 22px; display: grid; gap: 10px; align-content: start; }
  .benefit h3 { font-size: 24px; line-height: 1.15; font-weight: 700; }
  .benefit p { color: var(--muted); }

  /* providers */
  .providers { margin-top: 56px; display: grid; gap: 40px; }
  .group { display: grid; gap: 16px; }
  .logos { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; list-style: none; margin: 0; padding: 0; }
  .logos li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    font-weight: 500;
    font-size: 15px;
  }
  .logos .mark {
    flex: none;
    width: 36px;
    height: 36px;
    border-radius: 9px;
    background: var(--tile);
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .logos img { width: 24px; height: 24px; object-fit: contain; }

  footer { border-top: 1px solid var(--line); padding-block: 32px 48px; font: 13px var(--mono); color: var(--muted); }

  @media (max-width: 860px) {
    .easy { margin-top: 48px; }
    .benefits { grid-template-columns: 1fr; gap: 32px; }
    .hero { padding-block: 40px 64px; }
    section { padding-block: 64px; }
  }
  @media (max-width: 420px) {
    body { padding-inline: 16px; }
    .logos { grid-template-columns: 1fr 1fr; }
    .logos li { font-size: 14px; gap: 10px; padding: 10px; }
  }
</style>

<div class="wrap">
  <nav aria-label="Main">
    <a class="wordmark" href="/">web<span>/</span>router</a>
    <ul class="nav-links">
      <li><a href="/docs">Docs</a></li>
      <li><a href="/evals" aria-current="page">Evals</a></li>
      <li><a href="/changelog">Changelog</a></li>

    </ul>
  </nav>

  <main class="hero">
    <h1>Evals</h1>
  </main>
</div>
